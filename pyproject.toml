[project]
name = "rag-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dludhani-max", email = "dludhani@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "duckdb>=1.1.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jq>=1.10.0",
    "jupyter>=1.1.1",
    "langchain>=1.3.17",
    "langchain-anthropic>=1.7.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.11.1",
    "pandas>=2.0.0",
    "pdfminer-six>=20260107",
    "pdfplumber>=0.11.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.40.0",
    "tqdm>=4.70.0",
    "unstructured[image,pdf]>=0.27.1",
]

[project.scripts]
rag-learn = "rag_learn:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
